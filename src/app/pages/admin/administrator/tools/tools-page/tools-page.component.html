<nz-card class="tools-shell" [nzBordered]="false">
  <nz-row>

    <nz-col [nzXs]="24" class="tools-heading">
      <h2>Gestión de herramientas</h2>
    </nz-col>
    <nz-col [nzXs]="24">
      <div class="tools-grid">
      <a routerLink="/admin/tools/users" class="tool-card pointer">
        <div class="tool-card__icon">
          <i nz-icon nzType="team" nzTheme="outline"></i>
        </div>
        <div class="tool-card__content">
          <p class="m-b-0 font-size-18" style="color: rgba(60, 60, 67, 0.6);">Lista de Usuarios</p>
          <p class="m-0 font-size-18" style="font-weight: 400;">Ver Usuarios Registrados</p>
        </div>
      </a>

      <a routerLink="/admin/tools/orders" class="tool-card pointer">
        <div class="tool-card__icon">
          <i nz-icon nzType="shopping-cart" nzTheme="outline"></i>
        </div>
        <div class="tool-card__content">
          <p class="m-b-0 font-size-18" style="color: rgba(60, 60, 67, 0.6);">Lista de Órdenes</p>
          <p class="m-0 font-size-18" style="font-weight: 400;">Ver Pedidos Recibidos</p>
        </div>
      </a>

      <a routerLink="/admin/tools/cash" class="tool-card pointer">
        <div class="tool-card__icon">
          <i nz-icon nzType="wallet" nzTheme="outline"></i>
        </div>
        <div class="tool-card__content">
          <p class="m-b-0 font-size-18" style="color: rgba(60, 60, 67, 0.6);">Flujo de Caja</p>
          <p class="m-0 font-size-18" style="font-weight: 400;">Ver Resumen de Ingresos</p>
        </div>
      </a>

      <a routerLink="/admin/tools/request-patrocinio" class="tool-card pointer">
        <div class="tool-card__icon">
          <i nz-icon nzType="dollar-circle" nzTheme="outline"></i>
        </div>
        <div class="tool-card__content">
          <p class="m-b-0 font-size-18" style="color: rgba(60, 60, 67, 0.6);">Solicitudes de Pago</p>
          <p class="m-0 font-size-18" style="font-weight: 400;">Ver solicitudes de pago de Bonos Patrocinio</p>
        </div>
      </a>
      </div>
    </nz-col>
  </nz-row>
</nz-card>
