<nz-card class="orders-shell" [nzBordered]="false">
  <header class="orders-heading">
    <a routerLink="/admin/tools" class="back-button" aria-label="Volver a herramientas"><i nz-icon nzType="arrow-left" nzTheme="outline"></i></a>
    <div>
      <span class="section-label">Gestión comercial</span>
      <h2>Pedidos registrados</h2>
      <p>Consulta y administra los pedidos realizados en tu plataforma.</p>
    </div>
    <div class="heading-icon"><i nz-icon nzType="shopping-cart" nzTheme="outline"></i></div>
  </header>

  <section class="orders-toolbar">
    <div class="toolbar-label">
      <span class="toolbar-icon"><i nz-icon nzType="filter" nzTheme="outline"></i></span>
      <div><strong>Buscar pedidos</strong><small>Filtra por los datos del usuario</small></div>
    </div>
    <div class="search-fields">
      <nz-input-group [nzPrefix]="codeSearchIcon" class="search-control">
        <input type="text" [(ngModel)]="codeUser" nz-input placeholder="Buscar por código ID" appDelayedInput (delayedInput)="onSearch()">
      </nz-input-group>
      <ng-template #codeSearchIcon><i nz-icon nzType="idcard" nzTheme="outline"></i></ng-template>

      <nz-input-group [nzPrefix]="nameSearchIcon" class="search-control">
        <input type="text" [(ngModel)]="nameUser" nz-input placeholder="Buscar por nombre" appDelayedInput (delayedInput)="onSearch()">
      </nz-input-group>
      <ng-template #nameSearchIcon><i nz-icon nzType="user" nzTheme="outline"></i></ng-template>
    </div>
  </section>

  <app-table-payment-product-order [searchLoader]="eventSearch" [queryParams]="queryParams"></app-table-payment-product-order>
</nz-card>
