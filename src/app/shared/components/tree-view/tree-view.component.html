<div class="tree" *ngIf="tree.width && tree.height">
  <div class="wrapper" #origin>
    <svg class="treeLink" [style.width]="tree.width + 'px'" [style.height]="tree.height + 'px'">
      <path *ngFor="let link of visibleLinks"
        [attr.stroke]="link.child.isSelected ? (link.node.linkColor || '#d1d9e2') : '#d1d9e2'"
        [attr.d]="link.path" />
    </svg>

    <ng-container *ngFor="let node of visibleNodes; trackBy: trackNode">
      <div class="node-position"
        [style.left.px]="node.XPosition" [style.top.px]="node.YPosition"
        [style.width.px]="node.w" [style.height.px]="node.h">
        <ng-container *ngTemplateOutlet="template ? template : defaultTemplate; context:{$implicit:node}"></ng-container>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #defaultTemplate let-node>
  <div class="item">
    {{node.id}}
  </div>
</ng-template>
