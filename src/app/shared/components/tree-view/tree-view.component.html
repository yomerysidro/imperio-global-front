<div class="tree" *ngIf="tree.width && tree.height">
  <div class="wrapper" [style.width.px]="tree.width" [style.height.px]="tree.height">
    <svg class="treeLink" [style.width]="tree.width + 'px'" [style.height]="tree.height + 'px'">
      <ng-container *ngFor="let node of tree.nDatabaseNodes; trackBy: trackNode">
        <path *ngIf="node.branchPath" [attr.stroke]="node.linkColor" [attr.d]="node.branchPath" />
        <ng-container *ngFor="let path of node.paths; let i = index">
          <path class="tree-child-link"
            [attr.stroke]="node.nodeChildren[i].isSelected ? (node.linkColor || '#d1d9e2') : '#d1d9e2'"
            [attr.d]="path" />
        </ng-container>
      </ng-container>
    </svg>

    <ng-container *ngFor="let node of tree.nDatabaseNodes; trackBy: trackNode">
      <div class="positioned-node" [style.left.px]="node.XPosition" [style.top.px]="node.YPosition"
        [style.width.px]="node.w" [style.height.px]="node.h">
        <ng-container *ngTemplateOutlet="template ? template : defaultTemplate; context:{$implicit:node}"></ng-container>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #defaultTemplate let-node>
  <div class="item">
    {{node.id}}
  </div>
</ng-template>
