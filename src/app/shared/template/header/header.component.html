<div class="header">
    <div class="logo logo-dark p-t-10" >
        <a href="">
          <img src="assets/images/logo/5cd86c5269c85bcc6dfd9d97f1e772ee.png" alt="" class="img-fluid" width="190px">

        </a>
    </div>

    <div class="nav-wrap">
        <ul class="nav-left">
            <li class="desktop-toggle">
                <a (click)="toggleFold()" class="menu-toggle-button" [attr.aria-label]="isFolded ? 'Mostrar menú' : 'Ocultar menú'" [attr.title]="isFolded ? 'Mostrar menú' : 'Ocultar menú'">
                  <i nz-icon [nzType]="isFolded ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"></i>
                </a>
            </li>
            <li class="mobile-toggle">
                <a (click)="toggleExpand()" class="menu-toggle-button" [attr.aria-label]="isExpand ? 'Cerrar menú' : 'Abrir menú'" [attr.title]="isExpand ? 'Cerrar menú' : 'Abrir menú'">
                  <i nz-icon [nzType]="isExpand ? 'menu-fold' : 'menu-unfold'" nzTheme="outline"></i>
                </a>
            </li>
        </ul>

        <ul class="nav-right">
            <li>
                <a href="javascript:void(0)" class="header-user" aria-label="Abrir opciones de perfil" title="Mi perfil"
                   nz-dropdown [nzDropdownMenu]="profileMenu" nzTrigger="click" nzPlacement="bottomRight">
                    <span class="header-user__info">
                        <small>Usuario</small>
                        <strong>{{ userName }}</strong>
                    </span>
                    <span class="header-user__avatar">
                        <i nz-icon nzType="user" nzTheme="outline"></i>
                    </span>
                </a>
            </li>
        </ul>
    </div>
</div>

<nz-dropdown-menu #profileMenu="nzDropdownMenu">
    <ul nz-menu class="profile-dropdown">
        <li nz-menu-item class="profile-dropdown__identity" nzDisabled>
            <span class="profile-dropdown__data">
                <small>Nombre</small>
                <strong>{{ userName }}</strong>
                <small class="profile-dropdown__email-label">Correo</small>
                <span>{{ userEmail }}</span>
            </span>
        </li>
        <li nz-menu-divider></li>
        <li nz-menu-item class="profile-dropdown__logout" (click)="onLogout()">
            <i nz-icon nzType="logout" nzTheme="outline"></i>
            <span>Cerrar sesión</span>
        </li>
    </ul>
</nz-dropdown-menu>
