
name: Deploy Angular 18 Imperio Global

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: imperio-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Codigo desde GitHub
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar Dependencias
        run: npm ci

      - name: 4. Compilar Angular para Produccion
        run: npm run buildProd

      - name: 5. Verificar Archivos Compilados
        run: |
          test -f dist/imperio-global/index.html
          echo "Angular compilado correctamente"

      - name: 6. Desplegar Frontend en V2Networks
        uses: appleboy/scp-action@v1
        with:
          host: '205.234.243.127'
          username: 'ubuntu'
          password: ${{ secrets.V2_SSH_PASSWORD }}
          port: 22
          fingerprint: 'SHA256:zrXAwTBx3+1smpR+vc0Tjj78+jYk2gGitm4H/vxjos0'
          source: "dist/imperio-global/*"
          target: "/var/www/imperio-global-front"
          strip_components: 2
          overwrite: true
          rm: false
